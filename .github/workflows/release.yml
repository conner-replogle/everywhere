name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The remote desktop worker links Wayland, libgbm and GStreamer (cgo), so it
  # is built on a native runner per architecture and shipped in the Linux
  # archives next to the daemon.
  desktop-worker:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libgbm-dev libdrm-dev libxkbcommon-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - working-directory: daemon
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/conner-replogle/everywhere/daemon/internal/version.Version=${GITHUB_REF_NAME#v}"
          -o ../desktop-bin/linux_${{ matrix.arch }}/everywhere-desktop ./cmd/everywhere-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-worker-${{ matrix.arch }}
          path: desktop-bin

  goreleaser:
    needs: desktop-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-worker-*
          path: desktop-bin
          merge-multiple: true
      - run: chmod +x desktop-bin/*/everywhere-desktop && ls -lR desktop-bin
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app (apps/desktop): installers, and the latest*.yml its
  # updater reads from the latest release, versioned by the tag.
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            args: --linux AppImage --x64 --arm64
          - runner: macos-latest
            args: --mac --x64 --arm64
          - runner: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          # Secrets that aren't set come as empty strings, which electron-builder
          # takes as set (an empty CSC_LINK is a path to nothing).
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Without a certificate, sign ad hoc: Apple silicon won't open an unsigned app.
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          bunx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}" "${extra[@]}"
        env:
          # macOS only updates a signed, notarized app: these secrets do that.
          # Without them it still builds (unsigned), but won't update itself.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # Added to the release goreleaser made, so the daemon's and the app's
  # "latest release" are the same one.
  desktop-app-publish:
    needs: [goreleaser, desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-app-*
          path: desktop-app
          merge-multiple: true
      - run: ls -l desktop-app && gh release upload "$GITHUB_REF_NAME" desktop-app/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
