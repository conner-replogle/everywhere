name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The remote desktop worker links Wayland, libgbm and GStreamer (cgo), so it
  # is built on a native runner per architecture and shipped in the Linux
  # archives next to the daemon.
  desktop-worker:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwayland-dev libgbm-dev libdrm-dev libxkbcommon-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - working-directory: daemon
        run: >-
          go build -trimpath
          -ldflags "-s -w -X github.com/conner-replogle/everywhere/daemon/internal/version.Version=${GITHUB_REF_NAME#v}"
          -o ../desktop-bin/linux_${{ matrix.arch }}/everywhere-desktop ./cmd/everywhere-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-worker-${{ matrix.arch }}
          path: desktop-bin

  # On macOS the worker is an app of its own (daemon/macos, Swift), so Screen
  # Recording and Accessibility are granted to it; one universal build goes in
  # both darwin archives. It's a tarball between jobs because artifacts lose
  # file modes, and the app's signature must survive intact.
  desktop-app-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          # Signed with the Developer ID when there is one, so the Screen Recording
          # and Accessibility grants survive updates; otherwise ad hoc.
          if [ -n "$CSC_LINK" ]; then
            kc="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p ci "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p ci "$kc"
            echo "$CSC_LINK" | base64 --decode >"$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            export MAC_SIGN_IDENTITY="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          fi
          daemon/macos/build.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/app"
          codesign -dvv "$RUNNER_TEMP/app/EverywhereDesktop.app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature'
          mkdir -p desktop-bin/darwin
          tar -C "$RUNNER_TEMP/app" -czf desktop-bin/darwin/EverywhereDesktop.app.tar.gz EverywhereDesktop.app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-worker-darwin
          path: desktop-bin
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}

  goreleaser:
    needs: [desktop-worker, desktop-app-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-worker-*
          path: desktop-bin
          merge-multiple: true
      - run: |
          chmod +x desktop-bin/linux_*/everywhere-desktop
          tar -C desktop-bin/darwin -xzf desktop-bin/darwin/EverywhereDesktop.app.tar.gz
          rm desktop-bin/darwin/EverywhereDesktop.app.tar.gz
          ls -lR desktop-bin
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The desktop app (apps/desktop): installers, and the latest*.yml its
  # updater reads from the latest release, versioned by the tag.
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            args: --linux AppImage --x64 --arm64
          - runner: macos-latest
            args: --mac --x64 --arm64
          - runner: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          # Secrets that aren't set come as empty strings, which electron-builder
          # takes as set (an empty CSC_LINK is a path to nothing).
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # electron-builder wants the API key as a path to the .p8.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_KEY_P8
          # Without a certificate, sign ad hoc: Apple silicon won't open an unsigned app.
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          bunx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}" "${extra[@]}"
        env:
          # macOS only updates a signed, notarized app: these secrets do that.
          # Without them it still builds (unsigned), but won't update itself.
          # Notarization takes an App Store Connect API key (APPLE_API_*) or an
          # Apple ID with an app-specific password.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  # Added to the release goreleaser made, so the daemon's and the app's
  # "latest release" are the same one.
  desktop-app-publish:
    needs: [goreleaser, desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-app-*
          path: desktop-app
          merge-multiple: true
      - run: ls -l desktop-app && gh release upload "$GITHUB_REF_NAME" desktop-app/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
